<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Voz" />
  <meta name="theme-color" content="#040b1c" />
  <title>Voz - Central Executiva</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icone-voz.svg" />
  <link rel="apple-touch-icon" href="./icone-voz.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #040b1c; height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, Arial, sans-serif; color: #e8f2ff;
      background: radial-gradient(ellipse at 50% 40%, #0b2a5e 0%, #040b1c 70%) fixed;
      min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }
    .caixa { width: 100%; max-width: 420px; text-align: center; }
    h1 { font-size: 1.3rem; letter-spacing: .05em; margin-bottom: 18px; }
    label { display: block; margin: 14px 0 5px; font-size: .8rem; color: #8ea9cc; text-align: left; }
    input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #1d4a8a; background: #0a1a3a; color: #e8f2ff; font: inherit; }
    .btn { width: 100%; margin-top: 18px; border: 0; border-radius: 10px; padding: 13px; font: inherit; font-weight: 600; cursor: pointer; background: #3ab4ff; color: #021227; text-decoration: none; display: inline-block; }
    .aviso { font-size: .85rem; color: #8ea9cc; line-height: 1.5; }

    /* Tela de escuta — microfone pulsando + legenda do que está sendo dito */
    .pulso { font-size: 3.6rem; animation: pulsar 1.3s ease-in-out infinite; }
    @keyframes pulsar { 0%, 100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.18); opacity: 1; } }
    .etapa { margin-top: 16px; font-size: .95rem; color: #8ea9cc; }
    .transcript { margin-top: 10px; font-size: 1.4rem; min-height: 1.7em; font-weight: 600; }

    /* Confirmação de salvo — rápida, só o essencial */
    .marca { font-size: 3.4rem; margin-bottom: 10px; animation: entrarMarca .35s ease; }
    @keyframes entrarMarca { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    #ok-texto { font-size: 1.1rem; }
  </style>
</head>
<body>
<div class="caixa" id="tela-carregando">
  <p class="aviso">Carregando...</p>
</div>

<div class="caixa" id="tela-login" style="display:none">
  <h1>🎤 VOZ</h1>
  <p class="aviso">Entre pelo app principal da Central Executiva primeiro (a sessão é compartilhada).</p>
  <a class="btn" id="link-login" href="#">Abrir Central Executiva</a>
</div>

<!-- Fluxo COM reconhecimento de voz real: sem caixas de texto, só o microfone -->
<div class="caixa" id="tela-ouvindo" style="display:none">
  <div class="pulso">🎤</div>
  <p class="etapa" id="ouvindo-etapa">Diga o título do compromisso...</p>
  <p class="transcript" id="ouvindo-texto">&nbsp;</p>
</div>

<!-- Fallback SEM reconhecimento de voz (dispositivo não suporta): dita pelo
     microfone do próprio teclado, campo por campo -->
<div class="caixa" id="tela-form" style="display:none">
  <h1>🎤 Novo compromisso por voz</h1>
  <label>Título</label>
  <input id="f-titulo" enterkeyhint="next" />
  <label>Data</label>
  <input id="f-data" placeholder="Fale: hoje, amanhã, dia 20..." enterkeyhint="next" />
  <label>Hora</label>
  <input id="f-hora" placeholder="Fale: 15h, 3 da tarde, 15:30..." enterkeyhint="done" />
</div>

<!-- Confirmação — aparece por 2s e volta sozinha a ouvir o próximo -->
<div class="caixa" id="tela-ok" style="display:none">
  <div class="marca">✅</div>
  <p id="ok-texto"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="./firebase-config.js"></script>
<script>
const URL_APP = "https://joaoibira-ux.github.io/central-executiva/";
const $ = id => document.getElementById(id);
function mostrar(id) {
  ["tela-carregando", "tela-login", "tela-ouvindo", "tela-form", "tela-ok"].forEach(t => { $(t).style.display = t === id ? "" : "none"; });
}
function escHtml(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

firebase.initializeApp(window.FIREBASE_CONFIG);
const db = firebase.firestore();
const auth = firebase.auth();

$("link-login").href = URL_APP + "login.html";

// ---------- Interpretação de data/hora faladas (mesmo parser da Central Executiva) ----------
const MESES_FALADOS = { janeiro: 1, fevereiro: 2, "março": 3, marco: 3, abril: 4, maio: 5, junho: 6, julho: 7, agosto: 8, setembro: 9, outubro: 10, novembro: 11, dezembro: 12 };
const DIAS_SEMANA_FALADOS = { domingo: 0, segunda: 1, "segunda-feira": 1, "terça": 2, terca: 2, "terça-feira": 2, quarta: 3, "quarta-feira": 3, quinta: 4, "quinta-feira": 4, sexta: 5, "sexta-feira": 5, sabado: 6, "sábado": 6 };

function interpretarDataFalada(texto) {
  const t = (texto || "").trim().toLowerCase().replace(/[.,]/g, "");
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const paraISO = d => d.toISOString().slice(0, 10);
  if (/depois de amanh[ãa]/.test(t)) return paraISO(new Date(hoje.getTime() + 2 * 864e5));
  if (/amanh[ãa]/.test(t)) return paraISO(new Date(hoje.getTime() + 864e5));
  if (/\bhoje\b/.test(t)) return paraISO(hoje);
  for (const nome in DIAS_SEMANA_FALADOS) {
    if (t.includes(nome)) {
      const d = new Date(hoje);
      do { d.setDate(d.getDate() + 1); } while (d.getDay() !== DIAS_SEMANA_FALADOS[nome]);
      return paraISO(d);
    }
  }
  const mBarra = t.match(/(\d{1,2})\s*[\/\-]\s*(\d{1,2})/);
  if (mBarra) {
    const dia = Number(mBarra[1]), mes = Number(mBarra[2]);
    let d = new Date(hoje.getFullYear(), mes - 1, dia);
    if (d < hoje) d = new Date(hoje.getFullYear() + 1, mes - 1, dia);
    if (!isNaN(d) && d.getDate() === dia) return paraISO(d);
  }
  const mNomeMes = t.match(/(\d{1,2})\s*(?:de\s*)?(janeiro|fevereiro|março|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)/);
  if (mNomeMes) {
    const dia = Number(mNomeMes[1]), mes = MESES_FALADOS[mNomeMes[2]];
    let d = new Date(hoje.getFullYear(), mes - 1, dia);
    if (d < hoje) d = new Date(hoje.getFullYear() + 1, mes - 1, dia);
    if (!isNaN(d) && d.getDate() === dia) return paraISO(d);
  }
  const mSoDia = t.match(/dia\s*(\d{1,2})/);
  if (mSoDia) {
    const dia = Number(mSoDia[1]);
    let d = new Date(hoje.getFullYear(), hoje.getMonth(), dia);
    if (d < hoje) d = new Date(hoje.getFullYear(), hoje.getMonth() + 1, dia);
    if (!isNaN(d) && d.getDate() === dia) return paraISO(d);
  }
  return null;
}

function interpretarHoraFalada(texto) {
  const t = (texto || "").trim().toLowerCase().replace(/[.,]/g, "");
  if (/meio\s*dia/.test(t)) return "12:00";
  if (/meia\s*noite/.test(t)) return "00:00";
  let h = null, m = 0;
  const mHM = t.match(/(\d{1,2})\s*[:h]\s*(\d{2})?/);
  if (mHM) { h = Number(mHM[1]); m = mHM[2] ? Number(mHM[2]) : 0; }
  else {
    const mSo = t.match(/(\d{1,2})\s*horas?/);
    if (mSo) h = Number(mSo[1]);
  }
  if (h === null) return null;
  if (/e\s*meia/.test(t)) m = 30;
  else if (/e\s*quinze/.test(t)) m = 15;
  const tarde = /tarde/.test(t), noite = /noite/.test(t), manha = /manh[ãa]/.test(t);
  if ((tarde || noite) && h < 12) h += 12;
  if (manha && h === 12) h = 0;
  if (h < 0 || h > 23 || m < 0 || m > 59) return null;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}

function fmtDataBR(iso) {
  const [a, m, d] = iso.split("-");
  return d + "/" + m + "/" + a;
}

async function salvarCompromisso(uid, titulo, iso, hhmm) {
  await db.collection("usuarios").doc(uid).collection("agenda").add({
    titulo, data: iso, hora: hhmm, local: "", obs: "", anexos: [],
    feito: false, alarmeContagem: 0, alarmeVisto: false, telegramEnviado: false, whatsappEnviado: false,
    criadoEm: new Date().toISOString()
  });
  $("ok-texto").innerHTML = "<b>" + escHtml(titulo) + "</b><br>" + fmtDataBR(iso) + (hhmm ? " às " + hhmm : "");
  mostrar("tela-ok");
}

const TEM_RECONHECIMENTO_DE_VOZ = !!(window.SpeechRecognition || window.webkitSpeechRecognition);

// ---------- Fluxo COM reconhecimento de voz real (sem caixas de texto) ----------
// Cada etapa liga o microfone sozinha; "onend" (parou de falar) decide o
// resultado e já avança — nenhum toque na tela em momento nenhum. Termina a
// hora, salva, mostra "✅ Salvo" por 2s e volta a ouvir o título do próximo.
function ouvirFala(aoResultadoParcial, aoTerminar) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = "pt-BR"; rec.continuous = false; rec.interimResults = true;
  let textoFinal = "";
  rec.onresult = e => { textoFinal = Array.from(e.results).map(r => r[0].transcript).join(""); aoResultadoParcial(textoFinal); };
  rec.onend = () => aoTerminar(textoFinal);
  rec.onerror = () => aoTerminar(textoFinal);
  try { rec.start(); } catch (e) { aoTerminar(""); }
}

// Se o título já vier com data (e opcionalmente hora) dentro da mesma frase
// ("teste 01 hoje às 15 horas"), extrai os três de uma vez e pula direto pro
// salvamento, sem passar pelas telas de Data/Hora. Procura o PRIMEIRO
// marcador de data na frase; o que vem antes dele é o título; dentro do que
// vem depois, procura um marcador de hora pra separar data de hora. Se não
// achar nenhum marcador de data, retorna null e o fluxo segue normal
// (pergunta Data e Hora em etapas separadas).
const REGEX_DIAS_SEMANA = Object.keys(DIAS_SEMANA_FALADOS).map(nome => new RegExp("\\b" + nome + "\\b"));
const MARCADORES_DATA = [
  /depois de amanh[ãa]/, /amanh[ãa]/, /\bhoje\b/,
  ...REGEX_DIAS_SEMANA,
  /\d{1,2}\s*[\/\-]\s*\d{1,2}/,
  /\d{1,2}\s*(?:de\s*)?(?:janeiro|fevereiro|março|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)/,
  /\bdia\s*\d{1,2}\b/
];
const MARCADORES_HORA = [/meio\s*dia/, /meia\s*noite/, /\d{1,2}\s*[:h]\s*\d{0,2}/, /\d{1,2}\s*horas?/];

function extrairDataHoraDoTitulo(textoOriginal) {
  const t = textoOriginal.toLowerCase();
  let idxData = -1;
  for (const re of MARCADORES_DATA) {
    const m = t.match(re);
    if (m && (idxData === -1 || m.index < idxData)) idxData = m.index;
  }
  if (idxData === -1) return null;

  const titulo = textoOriginal.slice(0, idxData).trim();
  if (!titulo) return null;

  const resto = textoOriginal.slice(idxData);
  const restoMin = resto.toLowerCase();
  let idxHora = -1;
  for (const re of MARCADORES_HORA) {
    const m = restoMin.match(re);
    if (m && (idxHora === -1 || m.index < idxHora)) idxHora = m.index;
  }

  const parteData = idxHora === -1 ? resto : resto.slice(0, idxHora);
  const parteHora = idxHora === -1 ? "" : resto.slice(idxHora);

  const iso = interpretarDataFalada(parteData);
  if (!iso) return null;
  const hhmm = parteHora.trim() ? interpretarHoraFalada(parteHora) : "";
  if (parteHora.trim() && !hhmm) return null;

  return { titulo, iso, hhmm };
}

// Se a palavra "pendência(s)" aparecer no início OU no fim da frase
// ("pendências comprar açúcar" ou "comprar açúcar pendências"), o restante é
// o título, vai pra Pendências (mesma coleção "agenda", sem campo "data" — é
// assim que o app principal já distingue Pendências de Agenda) e NÃO volta a
// ouvir o próximo: mostra o aviso e tenta fechar o app.
function extrairPendencia(textoOriginal) {
  let m = textoOriginal.match(/^\s*pend[eê]ncias?\s+(.+)$/i);
  if (!m) m = textoOriginal.match(/^(.+)\s+pend[eê]ncias?\s*$/i);
  if (!m) return null;
  const resto = m[1].trim();
  if (!resto) return null;
  return resto.charAt(0).toUpperCase() + resto.slice(1);
}

// iOS costuma bloquear window.close() em apps adicionados à Tela de Início
// (só funciona de verdade pra abas abertas via script) — tenta mesmo assim;
// se não fechar, o aviso de "Salvo" já mostrado na tela fica como fallback.
function tentarFecharApp() {
  setTimeout(() => { window.close(); }, 900);
}

async function salvarPendenciaEFechar(titulo) {
  const uid = await prontoAuth;
  if (!uid) { mostrar("tela-login"); return; }
  try {
    await db.collection("usuarios").doc(uid).collection("agenda").add({
      titulo, data: "", hora: "", local: "", obs: "", anexos: [],
      feito: false, alarmeContagem: 0, alarmeVisto: false, telegramEnviado: false, whatsappEnviado: false,
      criadoEm: new Date().toISOString()
    });
    $("ok-texto").innerHTML = "<b>" + escHtml(titulo) + "</b><br>Salvo em Pendências";
    mostrar("tela-ok");
    tentarFecharApp();
  } catch (e) {
    alert("Não deu pra salvar: " + e.message);
    ouvirTitulo();
  }
}

async function salvarTudoDeUmaVez(titulo, iso, hhmm) {
  const uid = await prontoAuth;
  if (!uid) { mostrar("tela-login"); return; }
  try {
    await salvarCompromisso(uid, titulo, iso, hhmm);
    tentarFecharApp();
  } catch (e) {
    alert("Não deu pra salvar: " + e.message);
    ouvirTitulo();
  }
}

// "uid" só é necessário no finalzinho (salvar) — a escuta do Título começa
// ANTES de saber se o login já resolveu, pra pedir a permissão do microfone
// no mesmo instante em que o ícone é tocado (sem esperar o Firebase Auth
// responder primeiro, que daria uma demora perceptível entre abrir o app e
// aparecer o pedido de microfone). "prontoAuth" (definido mais abaixo) resolve
// assim que o login é confirmado — na prática, sempre antes do usuário
// terminar de ditar os 3 campos.
let tentativasTitulo = 0;
function etapa(texto) { $("ouvindo-etapa").textContent = texto; $("ouvindo-texto").textContent = ""; }

function ouvirTitulo() {
  mostrar("tela-ouvindo");
  etapa("Diga o título do compromisso...");
  ouvirFala(t => { $("ouvindo-texto").textContent = t; }, texto => {
    if (!texto.trim()) {
      tentativasTitulo++;
      if (tentativasTitulo >= 5) { alert("Não consegui ouvir — tente num lugar mais silencioso."); tentativasTitulo = 0; }
      ouvirTitulo();
      return;
    }
    tentativasTitulo = 0;
    const falado = texto.trim();
    const pendenciaTitulo = extrairPendencia(falado);
    if (pendenciaTitulo) { salvarPendenciaEFechar(pendenciaTitulo); return; }
    const tudo = extrairDataHoraDoTitulo(falado);
    if (tudo) { salvarTudoDeUmaVez(tudo.titulo, tudo.iso, tudo.hhmm); return; }
    ouvirData(falado);
  });
}
function ouvirData(titulo) {
  etapa("Agora diga a data (hoje, amanhã, dia 20...)");
  ouvirFala(t => { $("ouvindo-texto").textContent = t; }, texto => {
    const iso = interpretarDataFalada(texto);
    if (!iso) { alert('Não entendi a data — tente "hoje", "amanhã" ou "dia 20".'); ouvirData(titulo); return; }
    ouvirHora(titulo, iso);
  });
}
function ouvirHora(titulo, iso) {
  etapa("Agora diga a hora (ou fique em silêncio pra pular)");
  ouvirFala(t => { $("ouvindo-texto").textContent = t; }, async texto => {
    let hhmm = "";
    if (texto.trim()) {
      hhmm = interpretarHoraFalada(texto);
      if (!hhmm) { alert('Não entendi a hora — tente "15h", "3 da tarde" ou "15:30".'); ouvirHora(titulo, iso); return; }
    }
    const uid = await prontoAuth;
    if (!uid) { mostrar("tela-login"); return; } // raro: terminou de ditar antes do login confirmar, e não tava logado
    try {
      await salvarCompromisso(uid, titulo, iso, hhmm);
      setTimeout(ouvirTitulo, 2000);
    } catch (e) {
      alert("Não deu pra salvar: " + e.message);
      ouvirTitulo();
    }
  });
}

// ---------- Fallback SEM reconhecimento de voz: dita pelo teclado, campo a campo ----------
function iniciarFluxoComTeclado(uid) {
  mostrar("tela-form");
  const campoTitulo = $("f-titulo"), campoData = $("f-data"), campoHora = $("f-hora");
  campoTitulo.value = ""; campoData.value = ""; campoHora.value = "";

  function aoConfirmar(campo, fn) {
    campo.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); fn(); } };
  }
  campoTitulo.focus();
  aoConfirmar(campoTitulo, () => {
    if (!campoTitulo.value.trim()) { alert("Dite o título primeiro."); return; }
    campoData.focus();
  });
  aoConfirmar(campoData, () => {
    const iso = interpretarDataFalada(campoData.value);
    if (!iso) { alert('Não entendi a data — tente "hoje", "amanhã" ou "dia 20".'); return; }
    campoData.value = fmtDataBR(iso);
    campoData.dataset.iso = iso;
    campoHora.focus();
  });
  aoConfirmar(campoHora, async () => {
    const texto = campoHora.value.trim();
    let hhmm = "";
    if (texto) {
      hhmm = interpretarHoraFalada(texto);
      if (!hhmm) { alert('Não entendi a hora — tente "15h", "3 da tarde" ou "15:30".'); return; }
    }
    try {
      await salvarCompromisso(uid, campoTitulo.value.trim(), campoData.dataset.iso, hhmm);
      setTimeout(() => iniciarFluxoComTeclado(uid), 2000);
    } catch (e) {
      alert("Não deu pra salvar: " + e.message);
    }
  });
}

// Resolve com o uid (ou null se não tiver login) assim que o Firebase Auth
// responder — sem travar o início da escuta por voz, que já está rodando
// desde o toque no ícone.
let resolverProntoAuth;
const prontoAuth = new Promise(r => { resolverProntoAuth = r; });

auth.onAuthStateChanged(user => {
  resolverProntoAuth(user ? user.uid : null);
  if (!user && !TEM_RECONHECIMENTO_DE_VOZ) { mostrar("tela-login"); return; }
  if (!TEM_RECONHECIMENTO_DE_VOZ) iniciarFluxoComTeclado(user.uid);
});

// Com reconhecimento de voz: começa a ouvir (e pede a permissão do
// microfone) já na carga da página, aproveitando o mesmo toque no ícone —
// sem esperar o login resolver primeiro.
if (TEM_RECONHECIMENTO_DE_VOZ) ouvirTitulo();
</script>
</body>
</html>
